<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand2Hand | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <style type="text/tailwindcss">
      @layer components {
        body {
          @apply min-h-screen flex items-center justify-center p-6 text-white;
          font-family: "Inter", sans-serif;
          background: linear-gradient(rgba(10, 15, 28, 0.75), rgba(10, 15, 28, 0.75)), 
                      url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80&w=2070');
          background-size: cover;
          background-attachment: fixed;
        }

        .glass-card {
          @apply rounded-[2rem] p-10 md:p-14 shadow-2xl backdrop-blur-lg;
          background: rgba(17, 24, 39, 0.65);
          border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
          @apply w-full rounded-2xl py-4 px-6 text-base outline-none transition-all;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input:focus {
          @apply bg-white/[0.07] border-emerald-500/50;
        }

        /* Validation Style */
        .glass-input.invalid {
          @apply border-red-500/50 bg-red-500/5;
        }

        .error-msg {
          @apply text-red-500 text-[10px] font-bold uppercase tracking-wider mt-1 ml-2 block h-4;
        }

        .role-btn {
          @apply px-7 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 transition-all bg-white/[0.03] border border-white/[0.08];
        }

        .tab-active {
          @apply bg-slate-800/90 border-white/20 text-white;
        }

        .btn-primary {
          @apply px-10 py-4 rounded-full font-bold text-sm uppercase tracking-widest transition-all bg-emerald-500 shadow-[0_4px_14px_rgba(16,185,129,0.25)];
        }

        .btn-primary:hover {
          @apply bg-emerald-600 -translate-y-0.5 shadow-[0_6px_20px_rgba(16,185,129,0.35)];
        }
      }
    </style>
  </head>
  <body>

    <div class="w-full max-w-lg">
      <div class="glass-card">
        
        <div class="text-center mb-10">
          <h1 class="text-3xl md:text-4xl font-bold mb-3">
            Welcome <span class="text-emerald-500">Back</span>
          </h1>
          <p class="text-slate-400 text-sm">Please enter your details to sign in</p>
        </div>

        <div class="flex justify-center gap-3 mb-10">
          <button type="button" onclick="switchRole('user')" id="role-user" class="role-btn tab-active">User</button>
          <button type="button" onclick="switchRole('association')" id="role-association" class="role-btn">Association</button>
          <button type="button" onclick="switchRole('admin')" id="role-admin" class="role-btn">Admin</button>
        </div>

        <div id="flash" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold"></div>

        <form id="login-form" class="space-y-4" method="POST" action="process_login.php">
            <input type="hidden" name="account_type" id="account_type" value="user" />

            <div>
                <input type="email" name="email" required placeholder="Email Address" class="glass-input" id="email"/>
                <span class="error-msg" id="err-email"></span>
            </div>

            <div>
                <input type="password" name="password" required placeholder="Password" class="glass-input" id="pass"/>
                <span class="error-msg" id="err-pass"></span>
            </div>

            <button type="submit" class="btn-primary w-full">Sign In</button>
        </form>

        <p class="mt-12 text-center text-slate-400 text-xs">
          Don't have an account? 
          <a href="SignUp.html" class="text-white font-bold hover:text-emerald-500 ml-1">Create Account</a>
        </p>
      </div>
    </div>

    <script>
      // 0. Messages renvoyés par PHP (?error=1 / ?signup=success)
      (function () {
        const p = new URLSearchParams(location.search);
        const box = document.getElementById('flash');
        if (p.get('error')) {
          box.textContent = "Email ou mot de passe incorrect (vérifiez aussi le type de compte).";
          box.className = "mb-6 p-4 rounded-xl text-sm font-semibold bg-red-500/10 border border-red-500/30 text-red-400";
        } else if (p.get('signup') === 'success') {
          box.textContent = "Compte créé avec succès ! Vous pouvez vous connecter.";
          box.className = "mb-6 p-4 rounded-xl text-sm font-semibold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400";
        }
      })();

      // 1. Role Switching Logic
      function switchRole(role) {
        // 1. Remove the 'tab-active' class from ALL buttons
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.classList.remove('tab-active');
        });

        // 2. Add the class to the one we clicked
        document.getElementById('role-' + role).classList.add('tab-active');

        // 3. Update the hidden input for the PHP
        document.getElementById('account_type').value = role;
      }

      // 2. Validation Logic
      const loginForm = document.getElementById('login-form');
      
      loginForm.addEventListener('submit', function(e) {
        let isValid = true;
        
        // Elements
        const email = document.getElementById('email');
        const pass = document.getElementById('pass');
        
        // Reset
        document.querySelectorAll('.error-msg').forEach(msg => msg.innerText = "");
        [email, pass].forEach(input => input.classList.remove('invalid'));

        // Email Check
        if (!email.value.includes('@') || email.value.length < 5) {
          showError('email', "Please enter a valid email address");
          isValid = false;
        }

        // Password Check (basic check, backend handles the actual matching)
        if (pass.value.trim() === "") {
          showError('pass', "Password cannot be empty");
          isValid = false;
        }

        if (!isValid) {
          e.preventDefault();
        }
      });

      function showError(id, message) {
        const input = document.getElementById(id);
        const errorSpan = document.getElementById('err-' + id);
        input.classList.add('invalid');
        errorSpan.innerText = message;
      }
    </script>
  </body>
</html>
